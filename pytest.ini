[pytest]
markers =
    integration: 真实请求外部服务的集成测试（依赖网络/数据库）

# 默认只收集 tests/ 下的测试；显式传入路径（如 `pytest engines/`）时仍按传入路径收集。
testpaths = tests

# 不递归进这些目录：虚拟环境、前端产物，以及 tools/ 下可直接执行的独立脚本。
norecursedirs =
    .git
    .idea
    .pytest_cache
    project_venv
    venv
    node_modules
    frontend
    tools
